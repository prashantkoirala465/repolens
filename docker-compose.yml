services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repolens
      POSTGRES_PASSWORD: repolens
      POSTGRES_DB: repolens
    ports:
      - "5432:5432"
    volumes:
      - repolens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolens -d repolens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - repolens_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://repolens:repolens@postgres:5432/repolens
      DATABASE_URL: postgresql+asyncpg://repolens_app:repolens_app@postgres:5432/repolens
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://repolens_app:repolens_app@postgres:5432/repolens
      MIGRATION_DATABASE_URL: postgresql+asyncpg://repolens:repolens@postgres:5432/repolens
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://repolens_app:repolens_app@postgres:5432/repolens
      MIGRATION_DATABASE_URL: postgresql+asyncpg://repolens:repolens@postgres:5432/repolens
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  repolens_postgres_data:
  repolens_qdrant_data:
